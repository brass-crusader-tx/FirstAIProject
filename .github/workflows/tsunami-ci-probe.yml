name: TSUNAMI CI allocation probe
on:
  push:
    branches: [tsunami-ui-ci-probe-20260927]
  workflow_dispatch:
jobs:
  slim:
    runs-on: ubuntu-slim
    steps:
      - run: echo "TSUNAMI_ALT_RUNNER=PASS pool=ubuntu-slim"
  arm:
    runs-on: ubuntu-24.04-arm
    steps:
      - run: echo "TSUNAMI_ALT_RUNNER=PASS pool=ubuntu-24.04-arm"
  x64:
    runs-on: ubuntu-24.04
    steps:
      - run: echo "TSUNAMI_ALT_RUNNER=PASS pool=ubuntu-24.04"
